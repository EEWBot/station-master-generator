[package]
name = "jma-station-master"
version = "0.1.0"
edition = "2024"
description = "Convert JMA seismic intensity station information into a canonical JSON master with permanently stable indices and time-versioned metadata"
license = "MIT"
publish = false

[lib]
name = "jma_station_master"
path = "src/lib.rs"

[[bin]]
name = "jma-station-master"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
calamine = "0.36.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"

[lints.rust]
unsafe_code = "forbid"
